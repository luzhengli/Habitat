  <style>

    * { box-sizing:border-box; } html,body { width:1440px; height:1024px; margin:0; overflow:hidden; } body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif; color:var(--text); background:var(--canvas); } button { font:inherit; }

    main { height:904px; position:relative; } .hero { min-height:148px; display:flex; align-items:flex-end; justify-content:space-between; padding:29px 42px 24px; border-bottom:1px solid var(--border); } .eyebrow { display:block; margin-bottom:8px; color:var(--secondary); font-size:11px; font-weight:750; letter-spacing:.08em; } h1 { margin:0; font-size:28px; letter-spacing:-.02em; } .hero p { margin:8px 0 0; color:var(--secondary); font-size:13px; line-height:1.45; }

    .grid { display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:18px; margin-top:18px; } .card { overflow:hidden; border:1px solid var(--border); border-radius:10px; background:var(--primary); } .card-head { min-height:65px; display:flex; align-items:center; justify-content:space-between; padding:13px 19px; border-bottom:1px solid var(--border); } .card-head h2,.card-head h3{margin:0;font-size:15px}.card-head p{margin:5px 0 0;color:var(--secondary);font-size:11px}
    .status { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; white-space:nowrap; } .status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.status.ok{color:var(--success)}.status.bad{color:var(--danger)}.status.warn{color:var(--warning)}.status.neutral{color:var(--secondary)}
    .thead,.prow { display:grid; grid-template-columns:minmax(260px,1.3fr) 128px 106px 102px 112px; gap:12px; align-items:center; padding:0 18px; } .thead { height:38px; border-bottom:1px solid var(--border); color:var(--secondary); font-size:10px; font-weight:700; } .prow { min-height:70px; border-bottom:1px solid var(--border); } .prow:last-child{border-bottom:0}.prow.warnrow{background:#fffaf1}.pname strong{display:block;font-size:13px}.pname code{display:block;max-width:440px;margin-top:5px;overflow:hidden;color:var(--secondary);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;text-overflow:ellipsis;white-space:nowrap}
    .chip { display:inline-flex; align-items:center; width:max-content; min-height:24px; padding:0 8px; border-radius:12px; background:var(--subtle); color:var(--secondary); font-size:10px; font-weight:650; }.chip.ok{background:var(--success-soft);color:var(--success)}.chip.bad{background:var(--danger-soft);color:var(--danger)}.chip.warn{background:var(--warning-soft);color:var(--warning)}
    .rowbutton{min-height:32px;padding:0 10px;border:1px solid var(--strong);border-radius:7px;background:var(--primary);font-size:11px;font-weight:650}.aside{min-height:470px;display:flex;flex-direction:column}.section{padding:16px 19px;border-bottom:1px solid var(--border)}.section h3{margin:0 0 10px;font-size:12px}.line{display:flex;justify-content:space-between;margin-top:9px;color:var(--secondary);font-size:11px}.line b{color:var(--text)}.alert{padding:13px 14px;border:1px solid #e9b5b0;border-radius:8px;background:var(--danger-soft)}.alert.warning{border-color:#ebd19f;background:var(--warning-soft)}.alert strong{display:block;color:var(--danger);font-size:12px}.alert.warning strong{color:var(--warning)}.alert p{margin:6px 0 0;color:#82534f;font-size:11px;line-height:1.45}.alert.warning p{color:#765a2f}.asidefoot{margin-top:auto;padding:17px 19px}.asidefoot button{width:100%}.asidefoot small{display:block;margin-top:8px;color:var(--secondary);font-size:10px;line-height:1.45;text-align:center}
    .fixed { position:absolute; left:0; right:0; bottom:0; height:78px; display:flex; align-items:center; justify-content:space-between; padding:0 42px; border-top:1px solid var(--border); background:rgba(255,255,255,.97); }.fixed strong{display:block;font-size:13px}.fixed small{display:block;margin-top:5px;color:var(--secondary);font-size:11px}
    .center { width:820px; margin:0 auto; padding-top:100px; text-align:center; }.stateicon{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid var(--border);border-radius:50%;background:var(--primary);font-size:23px;font-weight:700}.stateicon.ok{border-color:#a9d4b4;background:var(--success-soft);color:var(--success)}.stateicon.bad{border-color:#e4aaa5;background:var(--danger-soft);color:var(--danger)}.center h1{font-size:25px}.center>p{max-width:590px;margin:10px auto 0;color:var(--secondary);font-size:13px;line-height:1.55}.center-actions{display:flex;justify-content:center;gap:10px;margin-top:24px}.resultcard{width:620px;margin:24px auto 0;text-align:left}.resultrow{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 17px;border-bottom:1px solid var(--border);font-size:12px}.resultrow:last-child{border-bottom:0}.resultrow span:last-child{font-weight:700}
    .spinner{width:30px;height:30px;margin:0 auto 18px;border:3px solid #e2e0da;border-top-color:var(--accent);border-radius:50%}.progress{width:520px;height:7px;margin:20px auto 0;overflow:hidden;border-radius:4px;background:#e5e3dd}.progress i{display:block;width:64%;height:100%;background:var(--accent)}.scanlist{width:680px;margin:22px auto 0;text-align:left}.scanrow{display:flex;align-items:center;justify-content:space-between;min-height:49px;padding:0 16px;border-bottom:1px solid var(--border);font-size:11px}.scanrow:last-child{border-bottom:0}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(38,38,35,.18)}.modal{width:560px;border:1px solid var(--strong);border-radius:12px;background:var(--primary);box-shadow:0 22px 70px rgba(30,29,26,.2)}.modalhead{padding:22px 24px 17px;border-bottom:1px solid var(--border)}.modalhead h2{margin:0;font-size:19px}.modalhead p{margin:7px 0 0;color:var(--secondary);font-size:12px;line-height:1.45}.modalbody{padding:18px 24px}.effect{display:grid;grid-template-columns:28px 1fr;gap:10px;margin:12px 0}.effect b{font-size:12px}.effect p{margin:4px 0 0;color:var(--secondary);font-size:11px;line-height:1.45}.num{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--subtle);font-size:11px;font-weight:700}.trust{margin-top:15px;padding:12px;border-radius:8px;background:var(--subtle);color:var(--secondary);font-size:11px;line-height:1.5}.modalfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
    .details { width:1120px; margin:24px auto 0; }.detailgroup{border-bottom:1px solid var(--border)}.detailgroup:last-child{border-bottom:0}.detailhead{display:flex;align-items:center;justify-content:space-between;padding:16px 19px;background:var(--subtle)}.detailhead strong{font-size:13px}.detailhead code{display:block;margin-top:4px;color:var(--secondary);font-size:10px}.linkrow{display:grid;grid-template-columns:180px 1fr 128px;gap:15px;align-items:center;min-height:62px;padding:0 19px;border-top:1px solid var(--border)}.linkrow strong{font-size:12px}.linkrow code{overflow:hidden;color:var(--secondary);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
    .recovery-context{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #f1c6c1;background:var(--accent-soft)}.recovery-context strong{font-size:12px}.recovery-context span{margin-left:10px;color:var(--secondary);font-size:11px}.workspace{height:852px;display:grid;grid-template-columns:250px minmax(0,1fr) 330px}.projectnav{padding:25px 15px;border-right:1px solid var(--border);background:#f7f6f2}.projectnav h3{margin:0 10px 12px;color:var(--secondary);font-size:11px}.projectitem{display:block;width:100%;padding:12px;border:0;border-radius:8px;background:transparent;text-align:left}.projectitem.selected{background:#eeece7}.projectitem strong{display:block;font-size:12px}.projectitem small{display:block;margin-top:4px;overflow:hidden;color:var(--secondary);font-size:9px;text-overflow:ellipsis;white-space:nowrap}.workmain{position:relative}.workhead{height:92px;padding:21px 25px;border-bottom:1px solid var(--border)}.workhead h2{margin:0;font-size:19px}.workhead p{margin:6px 0 0;color:var(--secondary);font-size:11px}.skillhead,.skilldraft{display:grid;grid-template-columns:minmax(220px,1fr) 118px 118px 118px;gap:10px;align-items:center;padding:0 24px}.skillhead{height:40px;border-bottom:1px solid var(--border);color:var(--secondary);font-size:10px;font-weight:700}.skilldraft{min-height:82px;border-bottom:1px solid var(--border);background:var(--primary)}.agentdraft{height:34px;display:grid;place-items:center;border:1px solid #ecb7b1;border-radius:7px;background:var(--accent-soft);color:var(--danger);font-size:10px;font-weight:700}.agentoff{height:34px;display:grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--subtle);color:var(--secondary);font-size:10px}.pending{position:absolute;left:20px;right:20px;bottom:20px;min-height:66px;display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border:1px solid var(--border);border-radius:9px;background:var(--primary)}.pending strong{display:block;font-size:12px}.pending small{display:block;margin-top:4px;color:var(--secondary);font-size:10px}.workaside{border-left:1px solid var(--border);background:var(--primary)}.workaside section{padding:20px;border-bottom:1px solid var(--border)}.workaside h3{margin:0 0 10px;font-size:13px}.workaside p{margin:0;color:var(--secondary);font-size:11px;line-height:1.5}
  </style>
</head>
<body>
  <div class="windowbar"><i class="traffic red"></i><i class="traffic yellow"></i><i class="traffic green"></i></div>
  <div class="appbar"><div class="brand"><span class="brand-mark"></span><span><strong>Habitat</strong><small>本地优先 · Skill 管理器</small></span></div><button class="secondary" id="exit">返回项目管理</button></div>
  <main id="app"></main>
  <script>
    const state = new URLSearchParams(location.search).get('state') || 'blocked';
    const app = document.querySelector('#app');
    const exit = document.querySelector('#exit');
    const hero = (tag,title,copy,action='') => `<header class="hero"><div><span class="eyebrow">${tag}</span><h1>${title}</h1><p>${copy}</p></div>${action}</header>`;
    const projectRows = (ready=false) => `<div class="thead"><span>项目</span><span>可访问性</span><span>相关链接</span><span>结果</span><span>处理</span></div>
      <div class="prow"><div class="pname"><strong>Habitat</strong><code>/Users/luyao/Project/Habitat</code></div><span class="chip ok">可访问</span><b class="${ready?'':'danger-text'}">${ready?'0':'1'} 个</b><span class="status ${ready?'ok':'bad'}">${ready?'通过':'阻断'}</span><button class="rowbutton">${ready?'查看':'处理链接'}</button></div>
      <div class="prow"><div class="pname"><strong>media</strong><code>/Users/luyao/Project/media</code></div><span class="chip ok">可访问</span><b class="${ready?'':'danger-text'}">${ready?'0':'2'} 个</b><span class="status ${ready?'ok':'bad'}">${ready?'通过':'阻断'}</span><button class="rowbutton">${ready?'查看':'处理链接'}</button></div>
      <div class="prow"><div class="pname"><strong>blog</strong><code>/Users/luyao/Project/blog</code></div><span class="chip ok">可访问</span><b>0 个</b><span class="status ok">通过</span><button class="rowbutton">查看</button></div>
      <div class="prow ${ready?'':'warnrow'}"><div class="pname"><strong>archive-lab</strong><code>/Volumes/Archive/archive-lab</code></div><span class="chip ${ready?'ok':'warn'}">${ready?'可访问':'磁盘未连接'}</span><b>${ready?'0 个':'未知'}</b><span class="status ${ready?'ok':'warn'}">${ready?'通过':'未完成'}</span><button class="rowbutton">${ready?'查看':'显示路径'}</button></div>`;
    const overview = (ready=false) => `${hero('GLOBAL RECOVERY','恢复到首次迁移前',ready?'所有已纳管和历史关联项目均已完成检查，可以进入最终确认。':'Habitat 必须检查所有已纳管和历史关联项目；未知状态不会被视为安全。','<button class="secondary">重新检查全部项目</button>')}<div class="body"><div class="metrics"><div class="metric"><b>4</b><span>必须检查的项目</span></div><div class="metric"><b class="${ready?'success-text':''}">${ready?'4 / 4':'3 / 4'}</b><span>已完成检查</span></div><div class="metric"><b class="${ready?'success-text':'danger-text'}">${ready?'0':'3'}</b><span>相关项目链接</span></div><div class="metric"><b class="${ready?'success-text':'danger-text'}">${ready?'0':'2'}</b><span>阻断原因</span></div></div><div class="grid"><section class="card"><div class="card-head"><div><h2>全量项目审计</h2><p>来自项目注册表和历史项目事务；每个项目必须得到明确结果。</p></div><span class="status ${ready?'ok':'warn'}">${ready?'全量通过':'尚未完成'}</span></div>${projectRows(ready)}</section><aside class="card aside"><div class="card-head"><div><h3>整笔恢复</h3><p>首次迁移 · 64b7e8a1</p></div><span class="status ${ready?'ok':'bad'}">${ready?'已就绪':'已阻断'}</span></div><div class="section"><h3>恢复后</h3><div class="line"><span>恢复原用户入口</span><b>2</b></div><div class="line"><span>移除本事务 Store 导入</span><b>43</b></div><div class="line"><span>自动修改项目链接</span><b>0</b></div><div class="line"><span>修改 Agent 设置</span><b>0</b></div></div><div class="section">${ready?'<div class="alert warning"><strong>这是一次整笔恢复</strong><p>点击后还会展示最终影响并执行一次新的后端预检。</p></div>':'<div class="alert"><strong>还不能恢复</strong><p>先处理 3 个相关链接并让 archive-lab 完成检查；不能通过移除项目记录绕过。</p></div>'}</div><div class="asidefoot"><button class="${ready?'danger':'secondary'}" ${ready?'':'disabled'}>${ready?'恢复到迁移前':'恢复整笔首次迁移'}</button><small>${ready?'下一步只确认一次，不选择 Skills。':'全部项目与迁移事务通过后才会启用。'}</small></div></aside></div></div>`;
    const render = {
      checking: () => { exit.textContent='取消检查'; return `${hero('GLOBAL RECOVERY','正在检查所有项目','正在从项目注册表和历史项目事务建立权威审计集合。')}<div class="center" style="padding-top:62px"><div class="spinner"></div><h1>检查项目链接与迁移事务</h1><p>当前正在检查 media 的 .agents、.claude 与 .trae 入口。检查期间不会修改文件。</p><div class="progress"><i></i></div><section class="card scanlist"><div class="scanrow"><span>Habitat</span><span class="status ok">检查完成</span></div><div class="scanrow"><span>media</span><span class="status neutral">正在检查</span></div><div class="scanrow"><span>blog</span><span class="status neutral">等待</span></div><div class="scanrow"><span>archive-lab</span><span class="status neutral">等待</span></div></section></div>`; },
      blocked: () => overview(false),
      ready: () => overview(true),
      links: () => `${hero('RELATED PROJECT LINKS','3 个链接仍依赖待移除的 Store 内容','Recovery 不会在这里删除链接。请进入对应项目，使用正常项目设置流程解除。','<button class="secondary">返回全局概览</button>')}<section class="card details"><div class="card-head"><div><h2>按项目分组</h2><p>以下路径均经过 lstat 与 canonical target 检查。</p></div><span class="status bad">整笔阻断</span></div><div class="detailgroup"><div class="detailhead"><div><strong>Habitat</strong><code>/Users/luyao/Project/Habitat</code></div><button class="secondary">前往项目处理</button></div><div class="linkrow"><strong>.agents · finding-unknowns</strong><code>/Users/luyao/Project/Habitat/.agents/skills/finding-unknowns</code><span class="status bad">仍在使用</span></div></div><div class="detailgroup"><div class="detailhead"><div><strong>media</strong><code>/Users/luyao/Project/media</code></div><button class="secondary">前往项目处理</button></div><div class="linkrow"><strong>.agents · browser</strong><code>/Users/luyao/Project/media/.agents/skills/browser</code><span class="status bad">仍在使用</span></div><div class="linkrow"><strong>.claude · browser</strong><code>/Users/luyao/Project/media/.claude/skills/browser</code><span class="status bad">仍在使用</span></div></div></section><div class="fixed"><div><strong>处理完成后必须返回执行全量复检</strong><small>项目设置仍会单独展示变更并确认；Recovery 不自动应用。</small></div><button class="secondary">返回全局概览</button></div>`,
      handoff: () => { exit.style.display='none'; return `<div class="recovery-context"><div><strong>正在处理 Recovery 阻断</strong><span>media 中有 2 个链接仍依赖首次迁移 Store 内容</span></div><button class="secondary">返回恢复检查</button></div><div class="workspace"><aside class="projectnav"><h3>项目</h3><button class="projectitem"><strong>Habitat</strong><small>/Users/luyao/Project/Habitat</small></button><button class="projectitem selected"><strong>media</strong><small>/Users/luyao/Project/media</small></button><button class="projectitem"><strong>blog</strong><small>/Users/luyao/Project/blog</small></button></aside><section class="workmain"><div class="workhead"><span class="eyebrow">MEDIA · RECOVERY BLOCKERS</span><h2>解除相关项目链接</h2><p>这里只显示阻断当前 Recovery 的 Skills；更改仍通过正常项目事务确认。</p></div><div class="skillhead"><span>Skill</span><span>.agents</span><span>.claude</span><span>.trae</span></div><div class="skilldraft"><div class="pname"><strong>browser</strong><code>2 个链接待移除</code></div><div class="agentdraft">待移除</div><div class="agentdraft">待移除</div><div class="agentoff">未链接</div></div><div class="pending"><div><strong>1 个 Skill · 2 个项目入口待移除</strong><small>不会修改 Store 内容或 Agent 设置；应用后返回 Recovery 全量复检。</small></div><div><button class="quiet">撤销</button><button class="primary">检查并应用</button></div></div></section><aside class="workaside"><section><span class="eyebrow">RECOVERY CONTEXT</span><h3>browser</h3><p>这两个相对符号链接当前解析到首次迁移导入的 Store Skill。</p></section><section><h3>应用后</h3><div class="line"><span>.agents/skills/browser</span><b>移除链接</b></div><div class="line"><span>.claude/skills/browser</span><b>移除链接</b></div><div class="line"><span>Store/browser</span><b>保持不变</b></div></section><section><div class="alert warning"><strong>Recovery 不会自动继续</strong><p>应用成功后请点击顶部“返回恢复检查”，Habitat 会重新检查全部项目。</p></div></section></aside></div>`; },
      confirm: () => `${overview(true)}<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>确认恢复到首次迁移前？</h2><p>Habitat 会再次执行全量预检；任何状态变化都会停止操作。</p></div><div class="modalbody"><div class="effect"><span class="num">1</span><div><b>恢复 2 个原用户入口</b><p>按事务记录恢复原目录或符号链接及其原始身份。</p></div></div><div class="effect"><span class="num">2</span><div><b>移除 43 个本事务 Store 导入</b><p>只移除指纹仍一致、由首次迁移创建的内容。</p></div></div><div class="trust">不会修改 Agent 设置，不会自动删除项目链接；项目注册记录和事务历史会保留。成功后 Habitat 返回首次设置。</div></div><div class="modalfoot"><button class="secondary">取消</button><button class="danger">确认恢复到迁移前</button></div></section></div>`,
