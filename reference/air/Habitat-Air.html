<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fa"><title>Habitat Air · 个人技能工作台</title><style>/* Habitat Air — semantic tokens, CSS logical pixels. No bundled or remote fonts. */
:root {
  color-scheme: light;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --canvas: #ffffff;
  --surface: #ffffff;
  --surface-subtle: #f7f8fa;
  --surface-hover: #f1f3f6;
  --surface-selected: #eaf0fc;
  --text-primary: #252830;
  --text-secondary: #656c78;
  --text-tertiary: #757c88;
  --border: #e7e9ee;
  --border-strong: #d4d9e2;
  --accent: #3268d8;
  --accent-strong: #2556bc;
  --accent-soft: #edf3ff;
  --positive: #287257;
  --positive-soft: #f0f7f3;
  --warning: #966820;
  --warning-soft: #fcf6e9;
  --danger: #b1454b;
  --danger-soft: #fbf0f1;
  --focus: #5487f0;
  --radius-sm: 6px;
  --radius-control: 8px;
  --radius-card: 14px;
  --radius-dialog: 18px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --sidebar-width: 224px;
  --toolbar-height: 52px;
  --control-height: 38px;
  --content-max: 1240px;
  --shadow-dialog: 0 24px 80px #17243c26, 0 4px 16px #17243c12;
  --transition: 140ms ease;
  /* Compatibility aliases for shared flow components. */
  --bg: var(--canvas); --paper: var(--surface); --ink: var(--text-primary);
  --muted: var(--text-secondary); --line: var(--border);
}

/* 01. Foundations */
* { box-sizing: border-box; }
html, body, #root { margin: 0; width: 100%; min-height: 100%; }
html { font-family: var(--font-sans); color: var(--text-primary); background: var(--canvas); -webkit-font-smoothing: antialiased; font-synthesis: none; }
body { font-size: 14px; line-height: 1.65; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition); }
button:disabled { cursor: not-allowed; opacity: .45; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
a { color: var(--accent); }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { font-weight: 600; }
input, textarea, select { min-width: 0; }
select { cursor: pointer; }
::selection { background: #dce7ff; }
.icon { flex-shrink: 0; vertical-align: -.1em; }
code, pre, .detail-slug { font-family: var(--font-mono); }
kbd { font-family: var(--font-sans); font-size: 11px; color: var(--text-tertiary); }
.sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-thumb { background: #d9dde4; border: 2px solid transparent; background-clip: padding-box; border-radius: 8px; }
[hidden] { display: none !important; }

/* 02. Shared controls. One saturated action per task surface. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--control-height); padding: 8px 15px; border: 1px solid var(--border-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--text-primary); font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap; }
.btn > span { display: inline-flex; align-items: center; gap: 7px; }
.btn > .icon { width: 14px; height: 14px; }
.btn:hover:not(:disabled) { background: var(--surface-subtle); border-color: #bfc7d4; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-danger { color: var(--danger); border-color: #ecd4d7; background: #fff; }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); border-color: #dba8ac; }
.btn-ghost { border-color: transparent; background: none; }
.btn-small { font-size: 12px; min-height: 32px; padding: 5px 11px; }
.icon-btn { width: 32px; height: 32px; border-radius: 7px; border: 0; background: none; color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
.text-btn { border: 0; background: none; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; }
.text-btn:hover { color: var(--accent-strong); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; line-height: 20px; padding: 1px 8px; border-radius: 5px; white-space: nowrap; background: var(--surface-hover); color: var(--text-secondary); }
.badge i { width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
.badge-green, .badge-blue { background: var(--accent-soft); color: #3863b5; }
.badge-amber { background: var(--warning-soft); color: var(--warning); }
.badge-rose { background: var(--danger-soft); color: var(--danger); }
.toggle { width: 34px; height: 20px; padding: 2px; border: 0; border-radius: 14px; background: #d9dde5; flex-shrink: 0; }
.toggle > span { display: block; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 1px 3px #20252e22; transform: translateX(0); transition: transform var(--transition); }
.toggle.on { background: var(--accent); }
.toggle.on > span { transform: translateX(14px); }
.skill-mark { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 12px; flex-shrink: 0; }
.skill-mark.small { width: 34px; height: 34px; border-radius: 9px; }
.skill-mark.small .icon { width: 16px; height: 16px; }
.skill-mark.tiny { width: 30px; height: 30px; border-radius: 8px; }
.skill-mark.tiny .icon { width: 14px; height: 14px; }
.skill-mark.large { width: 60px; height: 60px; border-radius: 16px; }
.color-violet { background: #f0edf9; color: #8072b2; }
.color-blue { background: #edf2fc; color: #6587bd; }
.color-green { background: #edf2fa; color: #6c85b5; }
.color-teal { background: #edf4f6; color: #668d9b; }
.color-amber { background: #faf3e8; color: #af905f; }
.color-rose { background: #f9eef0; color: #ad7a86; }
.color-slate { background: #eff1f5; color: #7a8496; }
.agent-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.agent-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); background: var(--surface-subtle); border: 1px solid var(--border); padding: 3px 9px; border-radius: 6px; line-height: 19px; white-space: nowrap; }
.agent-chips.small .agent-chip { padding: 1px 7px; font-size: 10px; }
.notice { display: flex; align-items: flex-start; gap: 10px; background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; font-size: 12px; color: var(--text-secondary); line-height: 1.8; }
.notice > .icon { margin-top: 3px; color: #8995a8; }
.notice strong { display: block; color: var(--text-primary); font-size: 12px; margin-bottom: 3px; font-weight: 500; }
.notice-warning { background: var(--warning-soft); border-color: #efdfbb; }
.notice-warning > .icon { color: var(--warning); }
.notice-success { background: var(--accent-soft); border-color: #dce6fb; }
.notice-success > .icon { color: var(--accent); }
.empty { text-align: center; padding: 64px 24px; color: var(--text-secondary); }
.empty-icon { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; background: var(--surface-subtle); color: #99a4b5; border-radius: 18px; }
.empty h3 { font-size: 17px; color: var(--text-primary); margin-bottom: 10px; }
.empty p { font-size: 13px; max-width: 430px; margin: 0 auto; }
.empty .btn { display: flex; width: fit-content; margin: 20px auto 0; }
.eyebrow { font-size: 11px; font-weight: 400; color: var(--text-tertiary); line-height: 1.5; margin-bottom: 4px; }
.muted { display: block; color: var(--text-tertiary); font-size: 11px; line-height: 1.8; }

/* 03. Desktop shell: native titlebar space is not a simulated window control. */
.app-shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; background: var(--canvas); }
.sidebar { width: var(--sidebar-width); flex-shrink: 0; background: var(--surface-subtle); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 0 16px 16px; overflow-y: auto; overflow-x: hidden; transition: width var(--transition); }
.native-titlebar-space { height: var(--toolbar-height); min-height: var(--toolbar-height); display: flex; align-items: center; padding-left: 5px; user-select: none; }
.native-titlebar-space span { color: #9298a3; font-size: 9px; letter-spacing: 1.05px; }
[data-shell="tauri-macos"] .native-titlebar-space span { display: none; }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 15px 11px 0; text-align: left; font-size: 21px; font-weight: 650; letter-spacing: -.7px; }
.brand-symbol { display: flex; align-items: center; justify-content: center; color: var(--accent); width: 29px; height: 32px; }
.workspace-label { font-size: 11px; color: var(--text-tertiary); margin: 6px 0 35px 50px; }
.nav-label { font-size: 11px; color: var(--text-tertiary); padding: 0 12px; margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; }
.main-nav { display: flex; flex-direction: column; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; border: 0; background: none; border-radius: 8px; padding: 9px 12px; color: #575f6d; text-align: left; font-size: 13px; white-space: nowrap; }
.nav-item > .icon:first-child { width: 16px; height: 16px; color: #7f8795; }
.nav-item > span:nth-child(2) { flex: 1; }
.nav-item:hover { background: #edeff3; color: var(--text-primary); }
.nav-item.active { background: #e8eefb; color: #3263bb; font-weight: 550; }
.nav-item.active > .icon:first-child { color: #4776c5; }
.nav-count { color: var(--text-tertiary); font-size: 11px; }
.nav-count.warm { background: #eee9df; color: #8b6b3b; padding: 0 6px; border-radius: 5px; line-height: 18px; font-size: 10px; }
.projects-label { margin-top: 32px; }
.sidebar-mini { display: inline-flex; justify-content: center; align-items: center; width: 24px; height: 24px; border: 0; border-radius: 5px; background: none; color: var(--text-tertiary); }
.sidebar-mini:hover { background: #e7eaf0; color: var(--text-primary); }
.project-nav { display: flex; flex-direction: column; gap: 3px; }
.nav-project { display: flex; align-items: center; gap: 9px; min-height: 36px; border: 0; border-radius: 7px; padding: 7px 12px; background: none; font-size: 12px; color: var(--text-secondary); text-align: left; }
.nav-project > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project-nav-icon { color: #929ba9; display: flex; align-items: center; }
.nav-project:hover, .nav-project.current { background: #edeff4; color: var(--text-primary); }
.project-count { margin-left: auto; font-size: 10px; color: #8a93a1; }
.sidebar-spacer { flex: 1; min-height: 48px; }
.local-status { display: flex; align-items: flex-start; gap: 8px; padding: 16px 12px 22px; color: var(--text-secondary); font-size: 11px; }
.local-status > .icon { margin-top: 3px; color: #8c96a6; }
.local-status span span { display: block; margin-top: 2px; color: var(--text-tertiary); font-size: 10px; }
.settings-nav, .help-nav { min-height: 36px; font-size: 12px; }
.help-nav kbd { color: #939cab; font-size: 11px; }
.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.topbar { height: var(--toolbar-height); min-height: var(--toolbar-height); border-bottom: 1px solid #eef0f3; display: flex; align-items: center; padding: 0 24px; gap: 20px; background: #fff; user-select: none; }
.breadcrumbs { display: flex; align-items: center; gap: 13px; color: #9098a5; font-size: 12px; white-space: nowrap; }
.breadcrumbs strong { font-weight: 450; color: #636c7c; }
.breadcrumbs > .icon { color: #b9bfca; }
.breadcrumbs > span:last-child { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
.toolbar-drag-space { flex: 1; align-self: stretch; min-width: 16px; }
.topbar-right { display: flex; align-items: center; gap: 24px; }
.global-search-button { display: flex; align-items: center; gap: 8px; background: none; border: 0; border-radius: 6px; color: #7c8493; height: 30px; font-size: 12px; padding: 0 5px; }
.global-search-button kbd { padding: 0 4px; border: 1px solid #e7e9ee; border-radius: 4px; font-size: 10px; line-height: 18px; }
.global-search-button:hover { background: var(--surface-subtle); color: var(--text-primary); }
.demo-badge { font-size: 10px; color: #7d8592; white-space: nowrap; }
.mobile-toggle { display: none; }
.main-content { flex: 1; overflow-y: auto; min-width: 0; width: 100%; padding: 43px 48px 36px; scroll-padding-top: 24px; }
.main-content > * { max-width: var(--content-max); margin-left: auto; margin-right: auto; }
.page-heading { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 76px; margin-bottom: 33px; }
.page-heading h1 { font-size: 30px; line-height: 1.3; letter-spacing: -.75px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
.page-heading p { font-size: 13px; line-height: 1.8; margin-top: 10px; color: var(--text-secondary); }
.heading-actions { display: flex; align-items: center; gap: 10px; }
.heading-actions .btn-secondary { border-color: transparent; background: none; color: var(--text-secondary); }
.heading-actions .btn-secondary:hover { background: var(--surface-subtle); border-color: var(--border); }
.heading-count { font-size: 14px; background: var(--surface-hover); color: var(--text-secondary); padding: 0 9px; border-radius: 7px; line-height: 26px; font-weight: 450; letter-spacing: 0; }
.heading-count.warm { background: var(--warning-soft); color: var(--warning); }

/* 04. Library: task controls, generous cards, two metadata items. */
.tabs { display: flex; align-items: center; gap: 25px; }
.tabs button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 12px 1px; color: var(--text-secondary); font-size: 13px; position: relative; line-height: 20px; white-space: nowrap; }
.tabs button:hover { color: var(--text-primary); }
.tabs button.active { color: var(--text-primary); font-weight: 550; }
.tabs button.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; border-radius: 2px; background: var(--text-primary); }
.tabs button > span { font-size: 10px; color: #7c8492; min-width: 16px; padding: 0 4px; background: #f0f2f5; line-height: 17px; border-radius: 4px; font-weight: 400; }
.tabs button.active > span { background: #e9edf4; color: #57647a; }
.library-tabs { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); gap: 16px; }
.segmented { display: flex; gap: 1px; border: 1px solid #eceef2; border-radius: 7px; background: #f8f9fb; padding: 3px; }
.segmented button { width: 28px; height: 25px; border: 0; border-radius: 4px; background: none; color: #969eab; display: flex; align-items: center; justify-content: center; }
.segmented button.active { background: #fff; color: #596679; box-shadow: 0 1px 3px #18243812; }
.library-toolbar { display: flex; align-items: center; gap: 12px; margin-top: 23px; margin-bottom: 24px; }
.search-input { display: flex; align-items: center; gap: 9px; height: 36px; min-width: 150px; width: 300px; max-width: 100%; padding: 0 12px; border: 1px solid var(--border); border-radius: 7px; color: #969eaa; background: #fff; }
.search-input:focus-within { border-color: #95b0e8; box-shadow: 0 0 0 2px #3268d812; }
.search-input input { border: 0; outline: none; background: none; width: 100%; color: var(--text-primary); font-size: 12px; }
.search-input input::placeholder { color: #858d9a; }
.search-input input:focus-visible { outline: none; }
.search-input > button { background: none; border: 0; color: #8a93a1; display: flex; align-items: center; padding: 3px; }
.select-wrap { display: flex; align-items: center; position: relative; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px; color: #7c8594; font-size: 12px; }
.select-wrap select, .sort-wrap select { appearance: none; -webkit-appearance: none; background: none; border: 0; color: var(--text-secondary); font-size: 12px; padding-right: 18px; outline-offset: 4px; }
.select-wrap > .icon:last-child, .sort-wrap > .icon { position: absolute; right: 10px; pointer-events: none; color: #8a93a1; }
.result-count { color: var(--text-tertiary); font-size: 11px; margin-left: 2px; }
.sort-wrap { display: flex; align-items: center; margin-left: auto; position: relative; padding-right: 6px; }
.sort-wrap > .icon { right: 0; }
.skill-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 22px; }
.skill-card { background: var(--surface); border: 1px solid #e5e8ed; border-radius: var(--radius-card); padding: 24px 26px 19px; min-height: 208px; display: flex; flex-direction: column; position: relative; transition: border-color var(--transition), box-shadow var(--transition); }
.skill-card:hover { border-color: #c8d3e5; box-shadow: 0 4px 14px #1f315508; }
.card-top { display: flex; align-items: center; gap: 13px; }
.card-title { min-width: 0; display: block; text-align: left; flex: 1; background: none; border: 0; padding: 0; }
.card-title h3 { font-size: 15px; font-weight: 560; line-height: 1.6; color: var(--text-primary); letter-spacing: -.15px; }
.origin { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.favorite-button { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; border: 0; border-radius: 6px; background: none; color: #b6becc; flex-shrink: 0; }
.favorite-button:hover { background: var(--surface-subtle); color: #8894a8; }
.favorite-button.saved { color: #9caecb; }
.favorite-button.saved:hover { color: #6689c6; }
.card-content { padding: 0; margin: 19px 0 24px; background: none; border: 0; text-align: left; display: block; flex: 1; }
.card-content p { font-size: 13px; color: var(--text-secondary); line-height: 1.8; min-height: 24px; max-width: 95%; }
.card-content:hover p { color: #4b596e; }
.card-meta { display: flex; align-items: center; gap: 9px; color: var(--text-tertiary); font-size: 11px; }
.usage-count { display: inline-flex; gap: 6px; align-items: center; padding: 2px 0; background: none; border: 0; color: var(--text-secondary); font-size: 11px; }
.usage-count .icon { color: #959fad; }
.usage-count:hover { color: var(--accent); }
.metadata-dot { color: #b9c0ca; }
.ownership { color: var(--text-tertiary); font-size: 11px; white-space: nowrap; }
.update-badge { background: none; color: #937344; border: 0; border-radius: 4px; font-size: 11px; padding: 1px 0; }
.update-badge:hover { color: #9d6411; text-decoration: underline; }
.card-use { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; border: 0; border-radius: 5px; background: none; padding: 3px 4px 3px 8px; color: #6b7c96; font-size: 11px; }
.card-use:hover { color: var(--accent); background: var(--accent-soft); }
.library-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 27px; padding: 5px 0 0; color: var(--text-tertiary); font-size: 11px; }
.library-bottom > span { display: flex; gap: 7px; align-items: center; }
.library-bottom .text-btn { color: var(--text-secondary); font-size: 11px; }
.list-view { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.list-view .skill-card { min-height: 91px; padding: 22px 24px; border: 0; border-radius: 0; display: grid; grid-template-columns: minmax(215px,.9fr) minmax(180px,1fr) minmax(215px,.9fr); align-items: center; gap: 24px; border-bottom: 1px solid var(--border); }
.list-view .skill-card:last-child { border-bottom: 0; }
.list-view .skill-card:hover { background: #fbfcfe; box-shadow: none; }
.list-view .card-content { margin: 0; }
.list-view .card-content p { font-size: 12px; max-width: none; }
.list-view .favorite-button { display: none; }
.list-view .skill-mark { width: 35px; height: 35px; border-radius: 10px; }
.list-view .skill-mark .icon { width: 17px; }

/* 05. Project workbench: selectable scopes, draft before apply. */
.project-cards { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
.project-card { display: grid; grid-template-columns: 32px 1fr; column-gap: 10px; position: relative; text-align: left; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 13px 18px 13px 14px; min-width: 193px; }
.project-card .project-square { grid-row: 1/3; align-self: center; }
.project-card > strong { font-size: 13px; font-weight: 500; line-height: 1.6; padding-right: 17px; }
.project-card > span:not(.project-square) { font-size: 10px; color: var(--text-tertiary); margin-top: 3px; }
.project-card:hover { background: #fafbfe; border-color: #cdd6e8; }
.project-card.selected { background: #f7f9fe; border-color: #adc3ec; }
.project-selected-check { position: absolute; right: 11px; top: 15px; color: #7397d7; width: 12px; height: 12px; }

/* 06. Diagnostics, history and settings. */

.care-note { display: flex; align-items: flex-start; gap: 10px; color: var(--text-tertiary); font-size: 11px; margin-top: 34px; padding: 0 5px; }

/* 07. Dialogs and detail sheets. */

.detail-hero { display: flex; align-items: center; gap: 17px; margin-bottom: 21px; }

.detail-slug { font-size: 13px; color: #515f74; margin-bottom: 8px; overflow-wrap: anywhere; }

.scope-card { display: flex; gap: 11px; align-items: flex-start; padding: 18px 0; margin-top: 12px; color: var(--text-tertiary); }

.help-logo { width: 66px; height: 66px; display: flex; align-items: center; justify-content: center; color: var(--accent); background: var(--accent-soft); border-radius: 17px; margin-bottom: 22px; }

/* 08. Add, assign, review, update and recovery flows. */

.form-error { display: block; margin: 10px 0; font-size: 12px; color: var(--danger); }
.fill-example { margin: 4px 0 18px; font-size: 11px; }
.add-preview { display: flex; gap: 14px; align-items: center; background: #f9fbff; border: 1px solid #e3eafa; border-radius: 11px; padding: 17px 18px; margin-bottom: 22px; }

.choice-card { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 17px 18px; margin: 12px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); text-align: left; transition: border-color var(--transition), background var(--transition); }

.radio { width: 15px; height: 15px; border: 1px solid #c3cbd8; border-radius: 50%; margin-top: 3px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

.scan-list { margin: 22px 0; border: 1px solid var(--border); border-radius: 10px; padding: 4px 16px; }

.modal-search { width: 100%; margin-bottom: 18px; }
.choose-list { max-height: 420px; overflow-y: auto; }
.choose-row, .assign-project { display: flex; width: 100%; gap: 13px; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 15px; margin-bottom: 9px; text-align: left; }
