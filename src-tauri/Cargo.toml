[package]
name = "habitat"
version = "0.1.0"
description = "A quiet, local-first Codex skill manager prototype"
authors = ["Habitat"]
edition = "2021"
default-run = "habitat"

[lib]
name = "habitat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
pathdiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
